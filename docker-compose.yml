version: '3.9'

services:
  # ─────────────────────────────────────────
  # MongoDB Database
  # ─────────────────────────────────────────
  mongo:
    image: mongo:6
    container_name: superbento_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-superbento}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-superbento_secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-superbento_erp}
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - superbento_network

  # ─────────────────────────────────────────
  # Redis (Session store, BullMQ, Cache)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: superbento_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD:-redis_secret}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superbento_network

  # ─────────────────────────────────────────
  # Mongo Express (DB Management UI)
  # ─────────────────────────────────────────
  mongo-express:
    image: mongo-express
    container_name: superbento_mongo_express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-superbento}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-superbento_secret}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-superbento}:${MONGO_PASSWORD:-superbento_secret}@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD:-admin123}
    ports:
      - '8081:8081'
    depends_on:
      - mongo
    networks:
      - superbento_network
    profiles:
      - tools

  # ─────────────────────────────────────────
  # NestJS API Server
  # ─────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    container_name: superbento_server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: mongodb://${MONGO_USER:-superbento}:${MONGO_PASSWORD:-superbento_secret}@mongo:27017/${MONGO_DB:-superbento_erp}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret_min_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret_min_32_chars}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      APP_PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - '4000:4000'
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - superbento_network
    profiles:
      - full

  # ─────────────────────────────────────────
  # React + Vite Client
  # ─────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: development
    container_name: superbento_client
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api/v1}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:4000}
    ports:
      - '5173:5173'
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - superbento_network
    profiles:
      - full

volumes:
  mongo_data:
  redis_data:

networks:
  superbento_network:
    driver: bridge
